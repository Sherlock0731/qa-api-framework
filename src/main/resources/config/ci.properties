# CI/CD environment configuration
env=ci

# ReqRes API Configuration
# These will be overridden by environment variables in CI
reqres.base.url=${REQRES_BASE_URL}
reqres.api.key=${REQRES_API_KEY}

# Beeceptor API Configuration
beeceptor.base.url=${BEECEPTOR_BASE_URL}

# Test User Credentials
test.user.email=${TEST_USER_EMAIL}
test.user.password=${TEST_USER_PASSWORD}
test.user.firstname=${TEST_USER_FIRSTNAME}
test.user.lastname=${TEST_USER_LASTNAME}
test.user.id=${TEST_USER_ID}

# Request Settings
request.timeout=30000
retry.attempts=3

# Parallel Execution
thread.count=${THREAD_COUNT}

# Logging
logging.detailed=false
