name: API Tests - Products

on:
  workflow_dispatch:
    inputs:
      thread_count:
        description: 'Number of parallel threads'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
  schedule:
    - cron: '0 3 * * *' # Daily at 3 AM UTC

jobs:
  test-products:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run products tests
        run: |
          mvn clean test \
            -Pproducts \
            -Denv=ci \
            -Dthread.count=${{ github.event.inputs.thread_count || '2' }} \
            -DBEECEPTOR_BASE_URL=${{ secrets.BEECEPTOR_BASE_URL }} \
            -DTHREAD_COUNT=${{ github.event.inputs.thread_count || '2' }}
      
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
      
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-products
          path: target/allure-results
          retention-days: 30
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-products
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-all
          path: target/logs/
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/*.xml
          check_name: Test Results - Products API
