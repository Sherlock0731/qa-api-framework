name: API Tests - Products

on:
  workflow_dispatch:
    inputs:
      thread_count:
        description: 'Number of parallel threads'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '4'

jobs:
  test-products:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout source code
      # ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Setup Java
      # ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ─────────────────────────────────────────────
      # Restore Allure history from gh-pages
      # ─────────────────────────────────────────────
      - name: Checkout gh-pages (Allure history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Restore Allure history
        run: |
          mkdir -p target/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* target/allure-results/history/
          fi

      # ─────────────────────────────────────────────
      # Create Allure executor.json
      # ─────────────────────────────────────────────
      - name: Create Allure executor info
        run: |
          mkdir -p target/allure-results
          cat <<EOFINNER > target/allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ github.workflow }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": "${{ github.run_number }}",
            "reportUrl": "https://sherlock0731.github.io/qa-api-framework/"
          }
          EOFINNER

      # ─────────────────────────────────────────────
      # Create Allure environment.properties
      # ─────────────────────────────────────────────
      - name: Create Allure environment info
        run: |
          cat <<EOFINNER > target/allure-results/environment.properties
          Threads=${{ github.event.inputs.thread_count || '1' }}
          Environment=CI
          Workflow=${{ github.workflow }}
          Profile=Products API
          EOFINNER

      # ─────────────────────────────────────────────
      # Run products API tests
      # ─────────────────────────────────────────────
      - name: Run products tests
        run: |
          mvn clean test \
            -Pproducts \
            -Denv=ci \
            -Dthread.count=${{ github.event.inputs.thread_count || '2' }} \
            -DBEECEPTOR_BASE_URL=${{ secrets.BEECEPTOR_BASE_URL }} \
            -DTHREAD_COUNT=${{ github.event.inputs.thread_count || '2' }}

      # ─────────────────────────────────────────────
      # Generate Allure report
      # ─────────────────────────────────────────────
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # ─────────────────────────────────────────────
      # Upload artifacts
      # ─────────────────────────────────────────────
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-products
          path: target/allure-results
          retention-days: 30

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-products
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-products
          path: target/logs/
          retention-days: 7

      # ─────────────────────────────────────────────
      # Publish test results
      # ─────────────────────────────────────────────
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/*.xml
          check_name: Test Results - Products API

      # ─────────────────────────────────────────────
      # Deploy Allure report to gh-pages
      # ─────────────────────────────────────────────
      - name: Deploy Allure report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
