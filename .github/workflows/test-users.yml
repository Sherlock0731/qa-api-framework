name: API Tests - Users

on:
  workflow_dispatch:
    inputs:
      thread_count:
        description: 'Number of parallel threads'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

jobs:
  test-users:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run users tests
        run: |
          mvn clean test \
            -Pusers \
            -Denv=ci \
            -Dthread.count=${{ github.event.inputs.thread_count || '2' }} \
            -DREQRES_BASE_URL=${{ secrets.REQRES_BASE_URL }} \
            -DREQRES_API_KEY=${{ secrets.REQRES_API_KEY }} \
            -DTEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }} \
            -DTEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }} \
            -DTEST_USER_FIRSTNAME=${{ secrets.TEST_USER_FIRSTNAME }} \
            -DTEST_USER_LASTNAME=${{ secrets.TEST_USER_LASTNAME }} \
            -DTEST_USER_ID=${{ secrets.TEST_USER_ID }} \
            -DTHREAD_COUNT=${{ github.event.inputs.thread_count || '2' }}
      
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
      
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-users
          path: target/allure-results
          retention-days: 30
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-users
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-all
          path: target/logs/
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/*.xml
          check_name: Test Results - Users API
